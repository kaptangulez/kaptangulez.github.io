<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaptan Gulez</title>
  <meta name="description" content="Kaptan Gulez — projeler">
  <meta name="author" content="Kaptan Gulez">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ececec'/%3E%3Ctext x='16' y='21.5' font-family='Helvetica,Arial,sans-serif' font-size='15' font-weight='600' text-anchor='middle' fill='%23121212'%3EKG%3C/text%3E%3C/svg%3E">
  <style>
    :root {
        color-scheme: dark;
        --bg: #121212;
        --fg: #ececec;
        --muted: #7a7a7a;
        --line: #2a2a2a;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    main {
        width: 100%;
        max-width: 360px;
    }

    h1 {
        margin: 0 0 32px;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--muted);
    }

    .projects {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .projects li {
        border-top: 1px solid var(--line);
    }

    .projects li:last-child {
        border-bottom: 1px solid var(--line);
    }

    .projects a {
        display: grid;
        grid-template-columns: 1fr auto;
        row-gap: 4px;
        padding: 14px 0;
        font-size: 18px;
        color: var(--fg);
        text-decoration: none;
        transition: opacity 0.15s;
    }

    .projects a::after {
        content: "↗";
        grid-column: 2;
        grid-row: 1;
        color: var(--muted);
    }

    .projects small {
        grid-column: 1 / -1;
        grid-row: 2;
        font-size: 14px;
        color: var(--muted);
    }

    .projects:hover a {
        opacity: 0.4;
    }

    .projects a:hover,
    .projects a:focus-visible {
        opacity: 1;
    }
  </style>
</head>

<body>
  <main>
    <h1>I have problems. Claude writes the apps.</h1>

    <ul class="projects">
      <li><a href="https://magpractice.com">magpractice.com<small>Drills for men's artistic gymnastics judge candidates.</small></a></li>
      <li><a href="https://dartchalk.app">dartchalk.app<small>Darts scorekeeper. X01, Cricket and friends.</small></a></li>
      <li><a href="https://kingdefteri.com">kingdefteri.com<small>Offline scorekeeper for the card game King.</small></a></li>
    </ul>
  </main>
</body>
</html>
